name: Feature request
description: Suggest an additive improvement to Wide Docks.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What editor/mobile workflow problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: contract
    attributes:
      label: Production v1 contract
      options:
        - label: This proposal should preserve the existing drag interaction by default.
          required: true
